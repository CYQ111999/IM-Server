# TODO：需要一个脚本（例如 init - release），帮助二进制定位到正确的目录，
# 也就是实际参与编译的二进制所在目录
archives:
  - format: tar.gz
    # 该名称模板使操作系统与架构标识与 uname 的输出保持一致。
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

    # 若希望压缩包内所有文件都放进同一个目录，把此项设为 true。
    # 设为 true 时，解压 'goreleaser_Linux_arm64.tar.gz' 会得到一个
    # 名为 'goreleaser_Linux_arm64' 的目录。
    # 设为 false 时，所有文件平铺解压。
    # 也可以设为自定义目录名（支持模板）。
    wrap_in_directory: true

    # Windows 平台的压缩包使用 zip 格式
    files:
      - CHANGELOG/*
      - deployment/*
      - config/*
      - build/*
      - scripts/*
      - Makefile
      - install.sh
      - docs/*
      - src: "*.md"
        dst: docs

        # 加入压缩包时去掉父级目录。
        strip_parent: true

        # 文件信息。
        # 并非所有压缩格式都支持这里的全部字段。
        #
        # 默认值：从源文件复制
        info:
          # 支持模板（v1.14 起）
          owner: root

          # 支持模板（v1.14 起）
          group: root

          # 必须为 time.RFC3339Nano 格式。
          #
          # 支持模板（v1.14 起）
          mtime: "{{ .CommitDate }}"

          # 文件权限。
          mode: 0644

    format_overrides:
    - goos: windows
      format: zip

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^test:"
      - "^chore"
      - "merge conflict"
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
      - go mod tidy
  groups:
    - title: Dependency updates
      regexp: '^.*?(feat|fix)\(deps\)!?:.+$'
      order: 300
    - title: "New Features"
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 100
    - title: "Security updates"
      regexp: '^.*?sec(\([[:word:]]+\))??!?:.+$'
      order: 150
    - title: "Bug fixes"
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 200
    - title: "Documentation updates"
      regexp: ^.*?doc(\([[:word:]]+\))??!?:.+$
      order: 400
    - title: "Build process updates"
      regexp: ^.*?build(\([[:word:]]+\))??!?:.+$
      order: 400
    - title: Other work
      order: 9999

