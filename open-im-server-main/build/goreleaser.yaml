nfpms:
  - id: packages
    builds:
      - openim-api
      - openim-cmdutils
      - openim-crontask
      - openim-msggateway
      - openim-msgtransfer
      - openim-push
      - openim-rpc-auth
      - openim-rpc-conversation
      - openim-rpc-friend
      - openim-rpc-group
      - openim-rpc-msg
      - openim-rpc-third
      - openim-rpc-user
    # 应用的供应商标识。
    vendor: OpenIMSDK
    homepage: https://github.com/openimsdk/open-im-server
    maintainer: kubbot <https://github.com/kubbot>
    description: |-
      Auto sync github labels
      kubbot && openimbot
    license: MIT
    formats:
      - apk
      - deb
      - rpm
      - termux.deb # Since: v1.11
      - archlinux # Since: v1.13
    dependencies:
      - git
    recommends:
      - golang


# 下面几行称为 modeline（模式行），详见 `:help modeline`
# 如果不需要或不使用，可以自行删除这几行。
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

# 默认值：'./dist'
dist: ./_output/dist

# .goreleaser.yaml
milestones:
  # 可以配置多个 milestone
  -
    # milestone 所属的仓库
    # 默认从 origin 远程地址中提取
    repo:
      owner: OpenIMSDK
      name: Open-IM-Server

    # 是否关闭该 milestone
    close: true

    # 出错时中断发布，例如 milestone 不存在。
    fail_on_error: false

    # milestone 名称
    #
    # 默认值：'{{ .Tag }}'
    name_template: "Current Release"

