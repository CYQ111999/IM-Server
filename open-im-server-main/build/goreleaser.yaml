# 这是一个带有常用默认值的 .goreleaser.yml 示例文件。
# 详细文档请参考 https://goreleaser.com

before:
  hooks:
    - make clean
    # 如果不使用 go modules，可以删除此项。
    - make tidy
    - make copyright.add
    # 如果不需要 go generate，可以删除此项。
    - go generate ./...

git:
  # 同一提交上存在多个 tag 时，收集当前与上一个 tag 所采用的排序方式。
  #
  # 默认值：'-version:refname'
  tag_sort: -version:creatordate

  # 同一提交上存在多个 tag 时，排序时用于指定预发布后缀的方式。
  #
  # 起始版本：v1.17
  prerelease_suffix: "-"

  # GoReleaser 需要忽略的 tag。
  # 匹配到下列任意值的 tag，都不会被识别为上一个或当前 tag。
  #
  # 支持模板。
  # 起始版本：v1.21。
  ignore_tags:
    - nightly
    # - "{{.Env.IGNORE_TAG}}"
  
snapshot:
  name_template: "{{ incpatch .Version }}-next"

