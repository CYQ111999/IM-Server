# OpenIM 的默认 Prometheus 告警规则组。
groups:
  - name: instance_down # 被监控目标持续不可达时触发。
    rules:
      - alert: InstanceDown
        expr: up == 0 # 最近一次抓取失败时，内置的 "up" 指标为 0。
        for: 1m # 条件持续为真超过 1 分钟才触发。
        labels:
          severity: critical # 供 Alertmanager 做路由与通知优先级判断。
        annotations:
          summary: "Instance {{ $labels.instance }} down"
          description: "{{ $labels.instance }} of job {{ $labels.job }} has been down for more than 1 minute."

  - name: database_insert_failure_alerts # 检测消息写入 Redis 或 MongoDB 失败的情况。
    rules:
      - alert: DatabaseInsertFailed
        expr: (increase(msg_insert_redis_failed_total[5m]) > 0) or (increase(msg_insert_mongo_failed_total[5m]) > 0) # 只要有增长，就说明最近 5 分钟出现过写入失败。
        for: 1m # 避免因瞬时抖动而触发。
        labels:
          severity: critical
        annotations:
          summary: "Increase in MsgInsertRedisFailedCounter or MsgInsertMongoFailedCounter detected"
          description: "Either MsgInsertRedisFailedCounter or MsgInsertMongoFailedCounter increased in the last 5 minutes, indicating message insert failures to Redis or MongoDB and a possible backend outage."

  - name: registrations_few # 运维预警规则：登录/注册活跃度异常偏低时触发。
    rules:
      - alert: RegistrationsFew
        expr: increase(user_login_total[1h]) == 0 # 1 小时内没有成功的登录/注册事件。
        for: 1m
        labels:
          severity: info
        annotations:
          summary: "Too few registrations within the time frame"
          description: "The number of registrations in the last hour is 0. There might be some issues."

  - name: messages_few # 运维预警规则：消息活跃度异常偏低时触发。
    rules:
      - alert: MessagesFew
        expr: (increase(single_chat_msg_process_success_total[1h])+increase(group_chat_msg_process_success_total[1h])) == 0 # 1 小时内没有成功的单聊或群聊消息。
        for: 1m
        labels:
          severity: info
        annotations:
          summary: "Too few messages within the time frame"
          description: "The number of messages sent in the last hour is 0. There might be some issues."
