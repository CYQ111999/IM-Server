# uri: 数据库连接 URI，留空则使用下方的 address 和账号密码配置
uri:
# address: MongoDB 服务器地址列表
address: [localhost:37017]
# database: 数据库名
database: openim_v3
# username: 数据库认证用户名
username: openIM
# password: 数据库认证密码
password: openIM123
# authSource: 认证库；使用 root 用户时设为 admin
authSource: openim_v3
# maxPoolSize: 连接池最大连接数
maxPoolSize: 100
# maxRetry: 数据库连接失败的最大重试次数
maxRetry: 10
# mongoMode: MongoDB 模式，可选 "standalone"（单机）、"replicaSet"（副本集）
mongoMode: "standalone"

# 以下配置仅 mongoMode 为 "replicaSet" 时生效
replicaSet:
  name: rs0
  hosts: [127.0.0.1:37017, 127.0.0.1:37018, 127.0.0.1:37019]
  # readConcern: 读关注级别，可选 "local"、"available"、"majority"、"linearizable"、"snapshot"
  readConcern: majority
  # maxStaleness: 数据最大陈旧时间（秒）
  maxStaleness: 90s

# 以下配置仅 mongoMode 为 "replicaSet" 时生效
readPreference:
  # mode: 读偏好模式，可选 "primary"、"primaryPreferred"、"secondary"、"secondaryPreferred"、"nearest"
  mode: primary
  maxStaleness: 90s
  # tagSets: 标签集合数组，按顺序区分优先级，空 map 必须放最后作为兜底
  tagSets:
    - datacenter: "cn-east"
      rack: "1"
      storage: "ssd"
    - datacenter: "cn-east"
      storage: "ssd"
    - datacenter: "cn-east"
    - {} # 空 map，表示任意节点

# 以下配置仅 mongoMode 为 "replicaSet" 时生效
writeConcern:
  # w: 写入节点数或标签（整数、"majority" 或自定义标签）
  w: majority
  # j: 是否等待 journal 落盘确认
  j: true
  # wtimeout: 写入超时时间
  wtimeout: 30s
