# storageLocation: 日志存储路径，默认即可，修改时请填完整路径
storageLocation: ../../../../logs/
# rotationTime: 日志轮转周期（小时），默认即可
rotationTime: 24
# remainRotationCount: 保留的日志文件数量，默认即可
remainRotationCount: 2
# remainLogLevel: 日志级别，生产环境用 3；调试环境用 6 输出更详细日志
remainLogLevel: 6
# isStdout: 是否输出到标准输出，默认即可
isStdout: false
# isJson: 是否以 JSON 格式记录日志，默认即可
isJson: false
# isSimplify: RPC 方法日志中，当 KeyAndValues 的值长度超过 50 时输出精简日志
isSimplify: true
