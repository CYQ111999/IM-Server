prometheus:
  # enable: 是否暴露 Prometheus 指标；true 表示允许抓取
  enable: true
  # autoSetPorts: 是否自动设置端口
  autoSetPorts: true
  # ports: Prometheus 监听端口，每个端口对应一个被监控实例，需自行管理
  # 仅 autoSetPorts 为 false 时生效
  ports:

ratelimiter:
  # enable: 是否启用限流
  enable: false
  # window: 每个窗口的时间长度
  window: 20s
  # bucket: 每个窗口的桶数量
  bucket: 500
  # cpuThreshold: CPU 阈值，有效范围 0–1000（1000 = 100%）
  cpuThreshold: 850

circuitBreaker:
  # enable: 是否启用熔断
  enable: false
  # window: 时间窗口大小（秒）
  window: 5s
  # bucket: 桶数量
  bucket: 100
  # success: 成功率阈值（0.6 表示 60%）
  success: 0.6
  # request: 请求阈值，达到后进行熔断评估
  request: 500
