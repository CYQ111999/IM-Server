# Prometheus 全局运行时配置。
global:
  scrape_interval:     15s # 抓取间隔设为 15 秒，默认是 1 分钟。
  evaluation_interval: 15s # 每 15 秒评估一次规则，默认是 1 分钟。
  # scrape_timeout 默认为 10s，除非在具体抓取任务中覆盖。

# Alertmanager 地址，用于接收 Prometheus 推送的告警事件。
alerting:
  alertmanagers:
    - static_configs:
        - targets: [127.0.0.1:19093] # Alertmanager 地址，格式为 host:port。

# Prometheus 加载的规则文件。
rule_files:
  - instance-down-rules.yml # OpenIM 默认告警规则；如有需要可在此追加更多文件。
# - first_rules.yml
# - second_rules.yml

# 用于采集基础设施与 OpenIM 服务指标的抓取任务。
scrape_configs:
  # job_name 会作为 “job” 标签附加到采集到的时间序列上。
  - job_name: node_exporter
    static_configs:
      - targets: [ 127.0.0.1:19100 ] # node_exporter 地址，用于采集主机 CPU、内存、磁盘和网络指标。

  # OpenIM 服务通过 admin API 动态发现。
  # 多机部署时，请把 127.0.0.1 换成可访问的内网地址。

  - job_name: openimserver-openim-api
    http_sd_configs:
      - url: "http://127.0.0.1:10002/prometheus_discovery/api" # OpenIM API 实例的服务发现地址。 OpenIM API instances.
