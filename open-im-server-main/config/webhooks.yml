# 消息/事件回调 webhook 配置：各钩子均为「动作前(before)/动作后(after)」触发
# enable: 是否启用该回调；timeout: 回调超时（秒）
# failedContinue: 回调失败时是否继续执行业务流程（true = 不阻塞主流程）
url: http://127.0.0.1:10006/callbackExample
beforeSendSingleMsg:
  enable: false
  timeout: 5
  failedContinue: true
  # deniedTypes: 只有 contentType 不在该列表中的消息才触发回调
  # 不设置则所有 contentType 的消息都触发
  deniedTypes: []
beforeUpdateUserInfoEx:
  enable: false
  timeout: 5
  failedContinue: true
afterUpdateUserInfoEx:
  enable: false
  timeout: 5
afterSendSingleMsg:
  enable: false
  timeout: 5
  # attentionIds: 只有接收方在该列表中的消息才触发回调
  # 不设置则所有用户的消息都触发
  attentionIds: []
  # 同 beforeSendSingleMsg 的说明
  deniedTypes: []
beforeSendGroupMsg:
  enable: false
  timeout: 5
  failedContinue: true
  # 同 beforeSendSingleMsg 的说明
  deniedTypes: []
beforeMsgModify:
  enable: false
  timeout: 5
  failedContinue: true
  # 同 beforeSendSingleMsg 的说明
  deniedTypes: []
afterSendGroupMsg:
  enable: false
  timeout: 5
  # attentionIds: 只有群 ID 在该列表中的群消息才触发回调
  # 不设置则所有用户的消息都触发
  attentionIds: []
  # 同 beforeSendSingleMsg 的说明
  deniedTypes: []
