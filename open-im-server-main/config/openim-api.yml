api:
  # listenIP: 监听 IP；0.0.0.0 表示内网外网都监听，推荐默认
  listenIP: 0.0.0.0
  # ports: 监听端口；配置多个将启动多个实例，数量必须与 prometheus.ports 一致
  ports: [ 10002 ]
  # 多实例 standalone 模式下 IP 解析异常时的兜底配置
  # registerIP:
  # compressionLevel: API 压缩级别；0: 默认压缩，1: 压缩率最高，2: 速度最快，-1: 不压缩
  compressionLevel: 0


prometheus:
  # enable: 是否暴露 Prometheus 指标；true 表示允许抓取
  enable: true
  # autoSetPorts: 是否自动设置端口
  autoSetPorts: true
  # ports: Prometheus 监听端口，数量必须与 api.ports 一致
  # 仅 autoSetPorts 为 false 时生效
  ports:
  # grafanaURL: 可通过浏览器访问的 Grafana 地址
  grafanaURL:

ratelimiter:
  # enable: 是否启用限流
  enable: false
  # window: 每个窗口的时间长度
  window: 20s
  # bucket: 每个窗口的桶数量
  bucket: 500
  # cpuThreshold: CPU 阈值，有效范围 0–1000（1000 = 100%）
  cpuThreshold: 850
