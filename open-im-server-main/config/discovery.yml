# enable: 服务发现方式，etcd 为 etcd 注册中心；standalone 模式运行时会被自动切换为进程内内存注册
enable: etcd
etcd:
  # rootDirectory: etcd 中的根目录
  rootDirectory: im
  # address: etcd 地址列表
  address: [localhost:12379]
  ## 注意：如果 etcd 开启了认证
  ## 必须同步更新 chat 项目中的用户名和密码
  username:
  password:

kubernetes:
  namespace: default

# rpcService: 各 RPC 服务在注册中心中的服务名（standalone 模式下为进程内注册名）
rpcService:
  user: user-rpc-service
  friend: friend-rpc-service
  msg: msg-rpc-service
  push: push-rpc-service
  messageGateway: messagegateway-rpc-service
  group: group-rpc-service
  auth: auth-rpc-service
  conversation: conversation-rpc-service
  third: third-rpc-service
