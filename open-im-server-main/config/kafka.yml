## Kafka 认证配置
username:
password:

# producerAck: 生产者确认级别
producerAck:
# compressType: 压缩类型（如 none、gzip、snappy）
compressType: none
# address: Kafka broker 地址列表
address: [localhost:19094]
# toRedisTopic: 在线消息投递 Redis 的 topic
toRedisTopic: toRedis
# toMongoTopic: 消息落库 MongoDB 的 topic
toMongoTopic: toMongo
# toPushTopic: 推送到 push 服务的 topic
toPushTopic: toPush
# toOfflinePushTopic: 离线推送的 topic
toOfflinePushTopic: toOfflinePush
# toRedisGroupID: toRedisTopic 的消费组 ID
toRedisGroupID: redis
# toMongoGroupID: toMongoTopic 的消费组 ID
toMongoGroupID: mongo
# toPushGroupID: toPushTopic 的消费组 ID
toPushGroupID: push
# toOfflinePushGroupID: toOfflinePushTopic 的消费组 ID
toOfflinePushGroupID: offlinePush
# tls: TLS（传输层安全）配置
tls:
  # enableTLS: 是否启用 TLS
  enableTLS: false
  # caCrt: CA 证书文件路径
  caCrt:
  # clientCrt: 客户端证书文件路径
  clientCrt:
  # clientKey: 客户端私钥文件路径
  clientKey:
  # clientKeyPwd: 客户端私钥密码
  clientKeyPwd:
  # insecureSkipVerify: 是否跳过 TLS 校验（生产环境不建议）
  insecureSkipVerify: false
