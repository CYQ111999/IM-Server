rpc:
  # registerIP: 本 RPC 服务注册的 IP；留空默认使用内网 IP
  registerIP:
  # listenIP: RPC 服务监听 IP；0.0.0.0 表示内网外网都监听，留空自动使用内网 IP
  listenIP: 0.0.0.0
  # autoSetPorts: 是否自动设置端口
  # 如果在 kubernetes 中使用，设为 false
  autoSetPorts: true
  # ports: RPC 服务监听端口列表；配置多个将启动多个实例，数量必须与 prometheus 端口一致
  # 仅 autoSetPorts 为 false 时生效
  ports:

prometheus:
  # enable: 是否暴露 Prometheus 指标；true 表示允许抓取
  enable: true
  # ports: Prometheus 监听端口，数量必须与 rpc.ports 一致，保证监控配置正确
  # 仅 autoSetPorts 为 false 时生效
  ports:

ratelimiter:
  # enable: 是否启用限流
  enable: false
  # window: 每个窗口的时间长度
  window: 20s
  # bucket: 每个窗口的桶数量
  bucket: 500
  # cpuThreshold: CPU 阈值，有效范围 0–1000（1000 = 100%）
  cpuThreshold: 850

circuitBreaker:
  # enable: 是否启用熔断
  enable: false
  # window: 时间窗口大小（秒）
  window: 5s
  # bucket: 桶数量
  bucket: 100
  # success: 成功率阈值（0.6 表示 60%）
  success: 0.6
  # request: 请求阈值，达到后进行熔断评估
  request: 500

