rpc:
  # registerIP: 本 RPC 服务注册的 IP；留空默认使用内网 IP
  registerIP:
  # listenIP: RPC 服务监听 IP；0.0.0.0 表示内网外网都监听，留空自动使用内网 IP
  listenIP: 0.0.0.0
  # autoSetPorts: 是否自动设置端口
  # 如果在 kubernetes 中使用，设为 false
  autoSetPorts: true
  # ports: RPC 服务监听端口列表；配置多个将启动多个实例，数量必须与 prometheus 端口一致
  # 仅 autoSetPorts 为 false 时生效
  ports:

ratelimiter:
  # enable: 是否启用限流
  enable: false
  # window: 每个窗口的时间长度
  window: 20s
  # bucket: 每个窗口的桶数量
  bucket: 500
  # cpuThreshold: CPU 阈值，有效范围 0–1000（1000 = 100%）
  cpuThreshold: 850

circuitBreaker:
  # enable: 是否启用熔断
  enable: false
  # window: 时间窗口大小（秒）
  window: 5s
  # bucket: 桶数量
  bucket: 100
  # success: 成功率阈值（0.6 表示 60%）
  success: 0.6
  # request: 请求阈值，达到后进行熔断评估
  request: 500

prometheus:
  # enable: 是否暴露 Prometheus 指标；true 表示允许抓取
  enable: false
  # ports: Prometheus 监听端口，数量必须与 rpc.ports 一致，保证监控配置正确
  # 仅 autoSetPorts 为 false 时生效
  ports:

# maxConcurrentWorkers: 最大并发 worker 数
maxConcurrentWorkers: 3
# enable: 离线推送开关；可选择 getui（个推）、fcm 或 jpush，需同时配置对应参数
enable:
getui:
  pushUrl: https://restapi.getui.com/v2/$appId
  masterSecret:
  appKey:
  intent:
  channelID:
  channelName:
fcm:
  # 优先使用文件路径；文件路径为空时使用 URL
  filePath:   # 文件路径会与 -c 参数（mage 默认传 config/）传入的值拼接
  authURL:   #  必须以 https 或 http 开头
jpush:
  appKey:
  masterSecret:
  pushURL:
  pushIntent:

# iOS 系统推送的声音与角标数
iosPush:
  pushSound: xxx
  badgeCount: true
  production: false

# fullUserCache: 是否缓存完整用户信息
fullUserCache: true
