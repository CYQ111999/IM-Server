# bucket: MinIO 中的存储桶名称
bucket: im-files
# accessKeyID: MinIO 认证的 Access Key ID
accessKeyID: im_minio
# secretAccessKey: MinIO 认证的 Secret Access Key
secretAccessKey: pg44FwzC5yhwlP75LhJnFMPX
# sessionToken: MinIO 认证的 Session Token（可选）
sessionToken:
# internalAddress: MinIO 服务的内网地址
internalAddress: localhost:10005
# externalAddress: MinIO 服务的外网访问地址，支持 HTTP/HTTPS 域名
externalAddress: http://external_ip:10005
# publicRead: 是否开启存储桶公开读
publicRead: false
