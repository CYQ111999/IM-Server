secret: openIM123

# imAdminUser: 即时通讯系统管理员配置
imAdminUser:
  # userIDs: 管理员用户 ID 列表，与下方 nicknames 按索引一一对应
  userIDs: [imAdmin]
  # nicknames: 管理员显示名列表，与上方 userIDs 按索引一一对应
  nicknames: [superAdmin]

# queue: 选择消息队列引擎
# 可选值：
# - kafka（默认）
# - redis
# - memory（仅 standalone 模式可用；微服务模式不能使用 memory）
queue: kafka


# 1: Android、iOS、Windows、Mac、Web 各平台同一时刻只能有一个实例在线
multiLogin:
  policy: 1
  # maxNumOneEnd: 单端最多保留的 token 数量
  maxNumOneEnd: 30

# rpcMaxBodySize: RPC 请求/响应体大小上限（字节）
rpcMaxBodySize:
  requestMaxBodySize:  8388608
  responseMaxBodySize: 8388608
