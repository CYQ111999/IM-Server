# 分析运行相关选项
run:
  # 默认并发数为可用的 CPU 核数
  concurrency: 4

  # 分析超时时间，例如 30s、5m，默认 1m
  timeout: 5m

  # 发现至少一个问题时返回的退出码，默认 1
  issues-exit-code: 1

  # 是否包含测试文件，默认 true
  tests: true

  # build tag 列表，所有 linter 都会使用，默认为空列表
  build-tags:
    - mytag

  # 需要跳过的目录：其中的问题不会被报告；
  # 这里可以使用正则，例如 generated.*，正则作用于完整路径；
  # 默认值为空列表，但默认目录是独立跳过的，与此选项取值无关
  # （见 skip-dirs-use-default）。“/” 会被替换为当前系统的路径分隔符，
  # 以便在 Windows 下正常工作。
  # skip-dirs:
  #   - components
  #   - docs
  #   - util
  #   - .*~
  #   - api/swagger/docs

  
  #   - server/docs
  #   - components/mnt/config/certs
  #   - logs

  # 默认为 true，启用以下目录的跳过：
  #   vendor$, third_party$, testdata$, examples$, Godeps$, builtin$
  # skip-dirs-use-default: true

  # 需要跳过的文件：它们仍会被分析，但其中的问题不会被报告。
  # 默认值为空列表；工具能够可靠识别自动生成的文件，
  # 因此无需手动列出全部自动生成的文件。
  # “/” 会被替换为当前系统的路径分隔符，以便在 Windows 下正常工作。
  # skip-files:
  #   - ".*\\.my\\.go$"
  #   - _test.go
  #   - ".*_test.go"
  #   - "mocks/"
  #   - ".github/"
  #   - "logs/"
  #   - "_output/"
  #   - "components/"

  # 默认不设置。设置后会传给 “go list -mod={option}”。摘自 “go help modules”：
  # 使用 -mod=readonly 时，go 命令不允许隐式更新 go.mod，
  # 一旦需要修改 go.mod 就会失败；适合在 CI 与测试流程中确认 go.mod 无需更新。
  # 使用 -mod=vendor 时，go 命令认为 vendor 目录中的依赖副本是准确的，
  # 并忽略 go.mod 中的依赖描述。

  # 允许同时运行多个 golangci-lint 实例。
  # 为 false（默认）时，golangci-lint 启动时会获取文件锁。
  allow-parallel-runners: true


# 输出相关配置
output:
  # 可选格式：colored-line-number、line-number、json、tab、checkstyle、code-climate，默认 "colored-line-number"
  # format: colored-line-number

  # 输出问题时附带对应代码行，默认 true
  print-issued-lines: true

  # 在问题描述末尾输出 linter 名称，默认 true
  print-linter-name: true

  # 按行去重输出问题，默认 true
  uniq-by-line: true

  # 为输出中的文件路径添加前缀，默认不加前缀
  path-prefix: ""

  # 结果排序依据：文件路径、行号、列号
  sort-results: true

# 各 linter 的具体配置
linters-settings:
  bidichk:
    # 以下配置用于检查全部列出的不可见 Unicode 字符。
    # 可以省略，因为默认已启用全部字符。
    left-to-right-embedding: true
    right-to-left-embedding: true
    pop-directional-formatting: true
    left-to-right-override: true
    right-to-left-override: true
    left-to-right-isolate: true
    right-to-left-isolate: true
    first-strong-isolate: true
    pop-directional-isolate: true

  dupl:
    # 触发告警的 token 数量，默认 150
    threshold: 200
  errcheck:
    # 报告未检查类型断言结果的情况：`a := b.(MyStruct)`；
    # 默认 false，即默认不报告。
    check-type-assertions: false

    # 报告把错误赋给空标识符的情况：`num, _ := strconv.Atoi(numStr)`；
    # 默认 false，即默认不报告。
    check-blank: false

    # [已废弃] 逗号分隔的 pkg:regex 键值对列表，
    # 其中正则用于忽略该包内的名称。（默认 "fmt:.*"）
    # 详见 https://github.com/kisielk/errcheck#the-deprecated-method
    #ignore: GenMarkdownTree,os:.*,BindPFlags,WriteTo,Help
    #ignore: (os\.)?std(out|err)\..*|.*Close|.*Flush|os\.Remove(All)?|.*print(f|ln)?|os\.(Un)?Setenv

    # 包含排除函数清单的文件路径，
    # 详见 https://github.com/kisielk/errcheck#excluding-functions
    # exclude: errcheck.txt

  errorlint:
    # 检查 fmt.Errorf 是否使用 %w 动词格式化错误，注意事项见 README
    errorf: true
    # 检查未加保护的普通类型断言与类型 switch
    asserts: true
    # 检查未加保护的错误比较（应使用 errors.Is / errors.As）
    comparison: true

  exhaustive:
    # 需要做穷尽性检查的程序元素。
    # 默认值：[ switch ]
    check:
      - switch
      - map
    # 同时检查生成文件中的 switch 语句
    check-generated: false
    # 表示只要存在 'default' 分支，就认为该 switch 已穷尽，
    # 即使并非所有枚举成员都出现在 switch 中。
    default-signifies-exhaustive: false
    # 与所给正则匹配的枚举成员无需出现在 switch 中，
    # 即可满足穷尽性要求。
    ignore-enum-members: ""
    # 只考虑包级作用域的枚举，忽略内部作用域
    package-scope-only: false


  forbidigo:
  # # 禁止以下标识符（标识符以正则书写）：
    forbid:
      # - ^print.*$
      - 'fmt\.Print.*'
      - fmt.Println.* # 日志噪声太大
      - ^unsafe\..*$
      - ^init$
      - ^os.Exit$
      - ^fmt.Print.*$
      - errors.New.*$
      - ^fmt.Println.*$
      - ^panic$
      - painc
  #     - ginkgo\\.F.* # 这些仅用于本地开发
  # # 从 forbidigo 检查中排除 godoc 示例，默认 true。
  #   exclude_godoc_examples: false

  funlen:
    lines: 220
    statements: 80

  gocognit:
    # 触发报告的最小代码复杂度，默认 30（建议 10-20）
    min-complexity: 30

  goconst:
    # 字符串常量的最小长度，默认 3
    min-len: 3
    # 触发告警的最小出现次数，默认 3
    min-occurrences: 3
    # 是否忽略测试文件，默认 false
    ignore-tests: false
    # 查找与取值匹配的已有常量，默认 true
    match-constant: true
    # 是否同时查找重复的数字，默认 false
    numbers: false
    # 最小值，仅对 goconst.numbers 生效，默认 3
    min: 3
    # 最大值，仅对 goconst.numbers 生效，默认 3
    max: 3
    # 当常量未作为函数参数使用时忽略，默认 true
    ignore-calls: true

  gocritic:
    # 需要启用哪些检查；不能与 'disabled-checks' 同时使用；
    # 检查项说明见 https://go-critic.github.io/overview#checks-overview
    # 想查看哪些检查已启用，可运行 `GL_DEBUG=gocritic golangci-lint run`
    # 默认使用稳定检查列表。
    enabled-checks:
      #- rangeValCopy
      - ruleguard

    # 需要禁用哪些检查；不能与 'enabled-checks' 同时使用；默认为空
    disabled-checks:
      - regexpMust
      - ifElseChain
      #- exitAfterDefer

    # 按标签批量启用检查，运行 `GL_DEBUG=gocritic golangci-lint run` 可查看全部标签与检查。
    # 默认为空列表。详见 https://github.com/go-critic/go-critic#usage 的 "Tags" 一节。
    enabled-tags:
      - performance
    disabled-tags:
      - experimental

    # 传给 gocritic 的设置。
    # 设置的 key 为受支持的 gocritic 检查器名称。
    # 受支持的检查器清单见 https://go-critic.github.io/overview。
    settings:
      captLocal: # 必须是有效的、已启用的检查名
        # 是否只检查参数（默认 true）
        paramsOnly: true
      elseif:
        # 是否跳过结构均衡的 if-else 分支（默认 true）
        skipBalanced: true
      hugeParam:
        # 触发告警的字节大小（默认 80）
        sizeThreshold: 80
      rangeExprCopy:
        # 触发告警的字节大小（默认 512）
        sizeThreshold: 512
        # 是否检查测试函数（默认 true）
        skipTestFuncs: true
      rangeValCopy:
        # 触发告警的字节大小（默认 128）
        sizeThreshold: 32
        # 是否检查测试函数（默认 true）
        skipTestFuncs: true
      ruleguard:
        # ruleguard 检查器所用 gorules 文件的路径
        rules: ''
      underef:
        # 当 x 为指针接收者时，是否跳过 (*x).method() 形式的调用（默认 true）
        skipRecvDeref: true

  gocyclo:
    # 触发报告的最小代码复杂度，默认 30（建议 10-20）
    min-complexity: 30
  cyclop:
    # 报告的最大代码复杂度
    max-complexity: 50
    # 包的平均复杂度上限。大于 0.0（浮点数）时启用该检查（默认 0.0）
    package-average: 0.0
    # 是否忽略测试（默认 false）
    skip-tests: false
  godot:
    # 需要检查的注释类型：`declarations`、`toplevel` 或 `all`
    scope: declarations
    # 用于把特定注释行排除在检查之外的正则列表
    exclude:
      # 示例：排除包含数字的注释
      - '[0-9]+'
      - 'func\s+\w+'
      - 'FIXME:'
      - '.*func.*'
    # 检查每句话是否以大写字母开头
    capital: true
  godox:
    # 报告以关键字开头的注释，适合识别被误留在代码中的 TODO / FIXME，
    # 这类注释应在合并前处理掉。
    keywords: # 默认关键字为 TODO、BUG 和 FIXME，可通过此设置覆盖
      #- TODO
      - BUG
      - FIXME
      #- NOTE
      - OPTIMIZE # 标记那些应在合并前优化的代码
      - HACK # 标记那些应在合并前移除的临时绕行写法
  gofmt:
    # 简化代码：使用 `-s` 选项运行 gofmt，默认 true
    simplify: true

  gofumpt:
    # 选择目标 Go 版本，默认 `1.18`。
    go-version: "1.21"

    # 是否启用默认关闭的额外规则，
    # 默认不启用
    extra-rules: false

  # goheader:
    # values:
      # const:
        # 这里按 k:v 格式定义常量类型的取值，例如：
        # COMPANY: MY COMPANY
      # regexp:
        # 这里定义正则类型的取值，例如
        # AUTHOR: .*@mycompany\.com
    # template: # |-
      # 这里填写源代码文件的版权头模板，例如：
      # 说明：{{ YEAR }} 是内置变量，返回当前机器时间对应的年份。
      #
      # {{ AUTHOR }} {{ COMPANY }} {{ YEAR }}
      # SPDX-License-Identifier: Apache-2.0

      # Licensed under the Apache License, Version 2.0 (the "License");
      # you may not use this file except in compliance with the License.
      # You may obtain a copy of the License at:

      #   http://www.apache.org/licenses/LICENSE-2.0

      # Unless required by applicable law or agreed to in writing, software
      # distributed under the License is distributed on an "AS IS" BASIS,
      # WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
      # See the License for the specific language governing permissions and
      # limitations under the License.
    # template-path:
      # 作为 'template' 指令的替代方案，也可以填写模板源文件的路径

  goimports:
    # 把以指定前缀开头的 import 排在第三方包之后；
    # 前缀以逗号分隔。
    local-prefixes: github.com/openimsdk/open-im-server

  gomnd:
    # 启用的检查清单，各项说明见 https://github.com/tommy-muehle/go-mnd/#checks。
    # 默认值：["argument", "case", "condition", "operation", "return", "assign"]
    checks:
      - argument
      - case
      - condition
      - operation
      - return
      - assign
    # 不参与分析的数字列表。
    # 这些数字需以字符串形式书写。
    # 始终忽略的取值："1"、"1.0"、"0"、"0.0"
    # 默认值：[]
    ignored-numbers:
      - '0666'
      - '0755'
      - '42'
    # 不参与分析的文件模式列表。
    # 始终忽略：`.+_test.go`
    # 默认值：[]
    ignored-files:
      - 'magic1_.+\.go$'
    # 不参与分析的函数模式列表。
    # 以下函数始终被忽略：`time.Date`、`strconv.FormatInt`、`strconv.FormatUint`、
    # `strconv.FormatFloat`、`strconv.ParseInt`、`strconv.ParseUint`、`strconv.ParseFloat`。
    # 默认值：[]
    ignored-functions:
      - '^math\.'
      - '^webhook\.StatusText$'
  gomoddirectives:
    # 是否允许本地 `replace` 指令，默认 false。
    replace-local: true
    # 允许的 `replace` 指令列表，默认为空。
    replace-allow-list:
      - google.golang.org/grpc

    # 允许在 `retract` 指令中不说明版本被撤回的原因，默认 false。
    retract-allow-no-explanation: false
    # 禁止使用 `exclude` 指令，默认 false。
    exclude-forbidden: false

  gomodguard:
    allowed:
      modules:    
        - gorm.io/gen                                                    # 允许的模块列表
        - gorm.io/gorm
        - gorm.io/driver/mysql
        - k8s.io/klog
        - github.com/allowed/module
        - go.mongodb.org/mongo-driver/mongo
        # - gopkg.in/yaml.v2
      domains:                                                        # 允许的模块域名列表
        - google.golang.org
        - gopkg.in
        - golang.org
        - github.com
        - go.mongodb.org
        - go.uber.org
        - openim.io
        - go.etcd.io
    blocked:
      versions:
        - github.com/MakeNowJust/heredoc:
            version: "> 2.0.9"
            reason: "use the latest version"
      local_replace_directives: false     # 设为 true 时，对通过 replace 指令从本地路径加载的包也报 lint 问题

  gosec:
    # 用于选择要运行的部分规则。
    # 可用规则见 https://github.com/securego/gosec#available-rules
    includes:
      - G401
      - G306
      - G101
    # 用于指定要显式排除的一组规则。
    # 可用规则见 https://github.com/securego/gosec#available-rules
    excludes:
      - G204
    # 排除自动生成的文件
    exclude-generated: true
    # 过滤掉严重级别低于给定值的问题。可选值：low、medium、high。
    severity: "low"
    # 过滤掉置信度低于给定值的问题。可选值：low、medium、high。
    confidence: "low"
    # 用于指定规则的配置。
    # gosec 官方并未完整文档化规则配置，可参考：
    # https://github.com/securego/gosec#configuration
    # https://github.com/securego/gosec/blob/569328eade2ccbad4ce2d0f21ee158ab5356a5cf/rules/rulelist.go#L60-L102
    config:
      G306: "0600"
      G101:
        pattern: "(?i)example"
        ignore_entropy: false
        entropy_threshold: "80.0"
        per_char_threshold: "3.0"
        truncate: "32"

  gosimple:
    # 选择目标 Go 版本，默认 '1.13'。
    go: "1.20"
    # https://staticcheck.io/docs/options#checks
    checks: [ "all" ]

  govet:
    # 各 analyzer 的设置
    settings:
      printf: # analyzer 名称；执行 `go tool vet help` 可查看全部 analyzer
        funcs: # 执行 `go tool vet help printf` 可查看 `printf` analyzer 支持的配置项
          - (github.com/golangci/golangci-lint/pkg/logutils.Log).Infof
          - (github.com/golangci/golangci-lint/pkg/logutils.Log).Warnf
          - (github.com/golangci/golangci-lint/pkg/logutils.Log).Errorf
          - (github.com/golangci/golangci-lint/pkg/logutils.Log).Fatalf

    # 按名称启用或禁用分析器
    enable:
      - atomicalign
    enable-all: false
    disable:
      - shadow
    disable-all: false

  depguard:
    rules:
      prevent_unmaintained_packages:
        list-mode: lax # 未显式拒绝即允许
        files:
          - $all
          - "!$test"
        allow:
          - $gostd
        deny:
          - pkg: io/ioutil
            desc: "replaced by io and os packages since Go 1.16: https://tip.golang.org/doc/go1.16#ioutil"
          - pkg: github.com/OpenIMSDK
            desc: "The OpenIM organization has been replaced with lowercase, please do not use uppercase organization name, you will use openimsdk"
          - pkg: log
            desc: "请使用项目封装的日志包，说明见 docs/日志与错误处理.md"
          - pkg: errors
            desc: "请使用项目封装的错误包（errs），说明见 docs/日志与错误处理.md 与 docs/错误码规范.md"

  importas:
    # 设为 `true` 时强制使用别名。
    no-unaliased: true
    # 别名列表
    alias:
      # 为 `knative.dev/serving/pkg/apis/serving/v1` 包使用 `servingv1` 别名
      - pkg: knative.dev/serving/pkg/apis/serving/v1
        alias: servingv1
      - pkg: gopkg.in/yaml.v2
        alias: yaml
      # 为 `knative.dev/serving/pkg/apis/autoscaling/v1alpha1` 包使用 `autoscalingv1alpha1` 别名
      - pkg: knative.dev/serving/pkg/apis/autoscaling/v1alpha1
        alias: autoscalingv1alpha1
      # 可以用正则来指定包路径，
      # 并按下面的正则展开语法指定别名。
      # 详见 https://github.com/julz/importas#use-regular-expression
      - pkg: knative.dev/serving/pkg/apis/(\w+)/(v[\w\d]+)
        alias: $1$2

  ireturn:
    # ireturn 允许同时使用 `allow` 与 `reject` 设置。
    # 这两项都是关键字与正则表达式列表，用于匹配接口名或包名。
    # keywords:
    # - `empty` 用于 `interface{}`
    # - `error` 用于 error 类型
    # - `stdlib` 表示标准库
    # - `anon` 表示匿名接口

    # 默认允许使用 errors、空接口、匿名接口，
    # 以及标准库提供的接口。
    allow:
    - anon
    - error
    - empty
    - stdlib
    # 可以指定接口名惯用的后缀
    - (or|er)$

    # 拒绝的正则模式
    reject:
    - github.com\/user\/package\/v4\.Type

  lll:
    # 最大行长度，超出的行会被报告，默认 250。
    # 默认把 '\t' 计为 1 个字符，可通过 tab-width 选项修改
    line-length: 250
    # 制表符对应的空格宽度，默认 1。
    tab-width: 4
  misspell:
    # 根据 US 或 UK 的语言环境偏好纠正拼写。
    # 默认使用中性英语。
    # 把 locale 设为 US 时，会把英式拼写 'colour' 纠正为 'color'。
    locale: US
    ignore-words:
      - someword
  nakedret:
    # 当函数的代码行数超过此值且存在裸返回时报告问题，默认 30
    max-func-lines: 30

  nestif:
    # 触发报告的 if 语句最小复杂度，默认 5
    min-complexity: 4

  nilnil:
    # 默认情况下，nilnil 会检查下述所有返回类型。
    checked-types:
      - ptr
      - func
      - iface
      - map
      - chan

  nlreturn:
    # 代码块的大小（包含仍算作 "OK" 的 return 语句），
    # 因此无需拆分 return。
    block-size: 1

  nolintlint:
    # 禁用后可确保所有 nolint 指令都真正生效，默认 true。
    allow-unused: false
    # 以下 linter 的 nolint 指令无需给出说明，默认 []。
    allow-no-explanation: [ ]
    # 启用后要求每条 nolint 指令后附非空说明，默认 false。
    require-explanation: false
    # 启用后要求 nolint 指令指明所抑制的具体 linter，默认 false。
    require-specific: true

  prealloc:
    # 注意：不建议在完成性能剖析之前启用该 linter。
    # 对多数程序而言，使用 prealloc 属于过早优化。

    # 仅对不含 return/break/continue/goto 的简单循环给出预分配建议。
    # 默认为 true。
    simple: true
    range-loops: true # 对 range 循环给出预分配建议，默认为 true
    for-loops: false # 对 for 循环给出预分配建议，默认为 false

  promlinter:
    # Promlinter 在静态分析阶段无法推断出全部指标名。
    # 启用严格模式后，参数解析失败引发的错误也会被计入。
    strict: false
    # 详细用法见 https://github.com/yeya24/promlinter#usage
    disabled-linters:
     - "Help"
     - "MetricUnits"
     - "Counter"
     - "HistogramSummaryReserved"
     - "MetricTypeInName"
     - "ReservedChars"
     - "CamelCase"
    
  predeclared:
    # 以逗号分隔的预声明标识符列表，这些标识符不会被报告
    ignore: ""
    # 检查时包含方法名与字段名（即限定名）
    q: false
  rowserrcheck:
    packages:
      - github.com/jmoiron/sqlx

  revive:
    # 详见 https://github.com/mgechev/revive#available-rules
    ignore-generated-header: true
    severity: warning
    rules:
      - name: indent-error-flow
        severity: warning
      - name: exported
        severity: warning
      - name: var-naming
        arguments: [ [ "OpenIM"] ]
        # arguments: [ ["ID", "HTTP", "URL", "URI", "API", "APIKey", "Token", "TokenID", "TokenSecret", "TokenKey", "TokenSecret", "JWT", "JWTToken", "JWTTokenID", "JWTTokenSecret", "JWTTokenKey", "JWTTokenSecret", "OAuth", "OAuthToken", "RPC" ] ]
      - name: atomic
      - name: line-length-limit
        severity: error
        arguments: [200]
      - name: unhandled-error
        arguments : ["fmt.Printf", "myFunction"]

  staticcheck:
    # 选择目标 Go 版本，默认 '1.13'。
    go: "1.20"
    # https://staticcheck.io/docs/options#checks
    checks: [ "all" ]

  stylecheck:
    # 选择目标 Go 版本，默认 '1.13'。
    go: "1.20"

    # https://staticcheck.io/docs/options#checks
    checks: [ "all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022" ]
    # https://staticcheck.io/docs/options#dot_import_whitelist
    dot-import-whitelist:
      - fmt
    # https://staticcheck.io/docs/options#initialisms
    initialisms: [ "ACL", "API", "ASCII", "CPU", "CSS", "DNS", "EOF", "GUID", "HTML", "HTTP", "HTTPS", "ID", "IP", "JSON", "QPS", "RAM", "RPC", "SLA", "SMTP", "SQL", "SSH", "TCP", "TLS", "TTL", "UDP", "UI", "GID", "UID", "UUID", "URI", "URL", "UTF8", "VM", "XML", "XMPP", "XSRF", "XSS" ]
    # https://staticcheck.io/docs/options#http_status_code_whitelist
    http-status-code-whitelist: [ "200", "400", "404", "500" ]

  tagliatelle:
    # 检查 struct tag 名称的大小写
    case:
      # 使用结构体字段名来校验 struct tag 的名称
      use-field-name: true
      rules:
        # 可使用任意 struct tag 类型。
        # 支持的命名风格：`camel`、`pascal`、`kebab`、`snake`、`goCamel`、`goPascal`、`goKebab`、`goSnake`、`upper`、`lower`
        json: camel
        yaml: camel
        xml: camel
        bson: camel
        avro: snake
        mapstructure: kebab

  testpackage:
    # 用于跳过文件的正则模式
    skip-regexp: (id|export|internal)_test\.go
  thelper:
    # 以下配置用于启用全部检查。由于默认已启用全部检查，这一段可以省略。
    # 删除不需要的检查项，即可只保留需要的检查。
    test:
      first: true
      name: true
      begin: true
    benchmark:
      first: true
      name: true
      begin: true
    tb:
      first: true
      name: true
      begin: true

  tenv:
    # 选项 `all` 会检查整个测试文件（`_test.go`），不限定方法/函数签名。
    # 默认只检查以 `*testing.T`、`*testing.B`、`testing.TB` 为参数的方法。
    all: false

  unparam:
    # 是否检查导出函数，默认 false。若没有外部程序或库引用你的代码，可设为 true。
    # 注意：开启该设置后，unparam 在文本编辑器中会产生大量误报：
    # 当它只针对项目子目录运行时，无法找到外部接口。所有文本编辑器集成
    # 都是以改动文件所在目录来调用 golangci-lint 的。
    check-exported: false
  # unused:
    # 把代码当作程序（而非库）处理，并报告未使用的导出标识符；默认 false。
    # 注意：开启该设置后，unused 在文本编辑器中会产生大量误报：
    # 当它只针对项目子目录运行时，无法找到函数的使用位置。所有文本编辑器集成
    # 都是以改动文件所在目录来调用 golangci-lint 的。
  whitespace:
    multi-if: false   # 强制每个跨行的 if 语句后换行（或加注释）
    multi-func: false # 强制每个跨行的函数签名后换行（或加注释）

  wrapcheck:
    # 字符串数组，用于指定需要忽略的签名片段。
    # 设置后会覆盖默认的忽略签名集合。
    # 更多说明见 https://github.com/tomarrell/wrapcheck#configuration
    ignoreSigs:
      - .Errorf(
      - errors.New(
      - errors.Unwrap(
      - .Wrap(
      - .WrapMsg(
      - .Wrapf(
      - .WithMessage(
      - .WithMessagef(
      - .WithStack(
    ignorePackageGlobs:
        - encoding/*
        - github.com/pkg/*
        - github.com/openimsdk/*
        - github.com/OpenIMSDK/*

  wsl:
    # 为 true 时，只有当被 append 的值与上一行的变量、字段或类型匹配，
    # append 才允许紧贴上一行。默认 true。
    strict-append: true
    # 只要相邻行存在匹配的变量、字段或类型，就允许调用与赋值紧贴在一起。
    # 默认 true。
    allow-assign-and-call: true
    # 允许赋值与任意语句紧贴。默认 false。
    allow-assign-and-anything: false
    # 允许多行赋值紧贴。默认 true。
    allow-multiline-assign: true
    # 允许 var 声明紧贴。
    allow-cuddle-declarations: false
    # 允许在代码块结尾处写行尾注释
    allow-trailing-comment: false
    # case 结尾行数达到该上限时强制换行（0 表示从不）。
    force-case-trailing-whitespace: 0
    # 强制把 err 检查与 err 变量赋值紧贴
    force-err-cuddling: false
    # 允许开头注释与代码之间用空行分隔
    allow-separated-leading-comment: false
  makezero:
    # 只允许长度为 0 的方式初始化 slice。默认 false。
    always: false

  # custom 段用于定义运行时加载的 linter 插件，详见 README
  #  for more info.
  #custom:
    # 每个自定义 linter 的名称必须唯一。
    #example:
      # 插件 *.so 的路径，可为绝对路径或本地路径，每个自定义 linter 必填
      #path: /path/to/example.so
      # 该 linter 的描述，可选，仅用于文档说明。
      #description: This is an example usage of a plugin linter.
      # 用于指向该 linter 的仓库地址，可选，仅用于文档说明。
      #original-url: github.com/golangci/example-linter

linters:
  # 请不要使用 `enable-all`：该选项已废弃，即将移除。
  # 使用 `enable-all` 配合 `disable` 的反向配置方式，在 golangci-lint 升级时难以维护
  # enable-all: true
  disable-all: true
  enable:
    - typecheck     # 基础类型检查
    - gofmt         # 格式检查
    - govet         # Go 官方静态检查工具
    - gosimple      # 简化代码的建议
    - errcheck
    - decorder
    - ineffassign
    - forbidigo
    - revive
    - reassign
    - tparallel
    - unconvert
    - fieldalignment
    - dupl
    - dupword
    - errname
    - gci
    - exhaustive
    - gocritic
    - goprintffuncname
    - gomnd
    - goconst
    - gosec
    - misspell      # 拼写错误检查
    - staticcheck   # 静态分析
    - unused        # 检查未使用的代码
    # - goimports     # 检查 import 是否已正确排序与格式化
    - godot         # 检查注释标点
    - bodyclose     # 确保 HTTP 响应体被关闭
    - stylecheck    # Go 代码风格检查
    - unused        # 检查未使用的代码
    - errcheck      # 检查遗漏的错误返回
  fast: true

issues:
  # 需要排除的问题文本正则列表，默认为空。
  # 但除该选项外，我们还会使用默认的排除模式，
  # 可通过 `exclude-use-default: false` 关闭。想查看全部默认排除模式，
  # 可执行 `golangci-lint run --help`
  exclude:
    - tools/.*
    - test/.*
    - components/*
    - third_party/.*

  # 按路径、linter、问题文本与来源分别配置排除规则
  exclude-rules:
    - linters:
      - revive
      path: (log/.*)\.go

    - linters:
      - wrapcheck
      path: (cmd/.*|pkg/.*)\.go

    - linters:
      - typecheck
        #path: (pkg/storage/.*)\.go
      path: (internal/.*|pkg/.*)\.go

    - path: (cmd/.*|test/.*|tools/.*|internal/pump/pumps/.*)\.go
      linters:
        - forbidigo

    - path: (cmd/[a-z]*/.*|store/.*)\.go
      linters:
        - dupl

    - linters:
        - gocritic
      text: (hugeParam:|rangeValCopy:)

    - path: (cmd/[a-z]*/.*)\.go
      linters:
        - lll

    - path: (validator/.*|code/.*|validator/.*|watcher/watcher/.*)
      linters:
        - gochecknoinits

    - path: (internal/.*/options|internal/pump|pkg/log/options.go|internal/authzserver|tools/)
      linters:
        - tagliatelle

    - path: (pkg/app/.*)\.go
      linters:
        - unused
        - forbidigo

    # 排除部分 staticcheck 消息
    - linters:
        - staticcheck
      text: "SA9003:"

    # 排除 go:generate 长行引发的 lll 问题
    - linters:
        - lll
      source: "^//go:generate "

    - text: ".*[\u4e00-\u9fa5]+.*"
      linters:
        - golint
      source: "^//.*$"

  # 除 `exclude` 选项外，我们还会使用默认的排除模式，
  # 可通过该选项关闭。想查看全部
  # 默认排除模式，可执行 `golangci-lint run --help`。
  # 该选项默认值为 true。
  exclude-use-default: true

  # 默认值为 false。设为 true 后，exclude 与 exclude-rules 中的
  # 正则会变为大小写敏感。
  exclude-case-sensitive: false

  # 需要启用或禁用的默认排除规则 ID 列表，默认为空。
  include:
    - EXC0002 # 取消对 golint 注释类问题的默认排除

  # 单个 linter 输出问题的最大数量，设为 0 表示不限制，默认 50。
  max-issues-per-linter: 0

  # 相同文本问题的最大数量，设为 0 表示不限制，默认 3。
  max-same-issues: 0

  # 只显示新增问题：若存在未暂存改动或未跟踪文件，
  # 只分析这些改动；否则只分析相对 HEAD~ 的改动。
  # 在把 golangci-lint 接入已有大型代码库时，这个选项非常有用，
  # 因为在接入时立刻修完所有历史问题并不现实，
  # 更好的做法是不允许新代码引入问题。
  # 默认为 false。
  new: false

  # 只显示 git 版本 `REV` 之后新增的问题
  # new-from-rev: REV

  # 只显示指定文件路径的 git patch 中新增的问题。
  #new-from-patch: path/to/patch/file

  # 自动修复发现的问题（若该 linter 支持）
  fix: true

severity:
  # 默认值为空字符串。
  # 设置问题的默认严重级别。若已定义 severity 规则而问题未匹配规则、
  # 或该规则未指定级别，则应用此默认
  # 级别。级别名称需与所选输出格式支持的名称一致：
  # - Code climate：https://docs.codeclimate.com/docs/issues#issue-severity
  # - Checkstyle：https://checkstyle.sourceforge.io/property_types.html#severity
  # - Github：https://help.github.com/en/actions/reference/workflow-commands-for-github-actions#setting-an-error-message
  default-severity: error

  # 默认值为 false。
  # 设为 true 后，severity-rules 中的正则会变为大小写敏感。
  case-sensitive: false

  # 默认值为空列表。
  # 提供 severity 规则列表后，级别信息会被附加到 lint
  # 问题中。severity 规则的过滤能力与 exclude 规则相同，区别在于
  # 每条 severity 规则只能指定一个匹配器。
  # 仅对支持设置级别信息的输出格式生效。
  rules:
    - linters:
      - dupl
      severity: info
