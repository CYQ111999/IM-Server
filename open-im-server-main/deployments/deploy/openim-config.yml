  webhooks.yml: |
    url: http://127.0.0.1:10006/callbackExample
    beforeSendSingleMsg:
      enable: false
      timeout: 5
      failedContinue: true
      # 只有 contentType 属于 allowedTypes 的消息才会触发回调。
      # 支持两种写法：单个类型，或区间。区间由上下界以连字符（"-"）连接表示。
      # 例如 allowedTypes: [1, 100, 200-500, 600-700] 表示只有处于以下范围内的 contentType
      # {1, 100} ∪ [200, 500] ∪ [600, 700] 才能通过该过滤。
      # 不配置时，所有 contentType 的消息都会通过该过滤。
      allowedTypes: []
      # 只有 contentType 不在 deniedTypes 中的消息才会触发回调。
      # 支持两种写法，与 allowedTypes 相同。
      # 不配置时，所有 contentType 的消息都会通过该过滤。
      deniedTypes: []
    beforeUpdateUserInfoEx:
      enable:  false
      timeout: 5
      failedContinue: true
    afterUpdateUserInfoEx:
      enable:  false
      timeout: 5
    afterSendSingleMsg:
      enable: false
      timeout: 5
      # 只有 senID/recvID 命中 attentionIds 的消息才会触发回调
      # 不配置时，所有用户消息都会触发回调
      attentionIds: []
      # 参见 beforeSendSingleMsg 处的注释。
      allowedTypes: []
      deniedTypes: []
