  share.yml: |
    secret: yiF2sIaAayrDRPDGbkfjftb80MdUbHbh

    imAdminUserID: ["imAdmin"]

    # 1：Android、iOS、Windows、Mac 与 Web 平台同一时间只允许一个实例在线
    multiLogin:
      policy: 1
      maxNumOneEnd: 30

  kafka.yml: |
    # 认证用户名
    username: ''
    # 认证密码
    password: ''
    # 生产者确认（acks）设置
    producerAck:
    # 压缩类型（例如 none、gzip、snappy）
    compressType: none
    # Kafka broker 地址列表
    address: [ "kafka-service:19094" ]
    # 写入 Redis 所用的 Kafka topic
    toRedisTopic: toRedis
    # 写入 MongoDB 所用的 Kafka topic
    toMongoTopic: toMongo
    # 推送通知所用的 Kafka topic
    toPushTopic: toPush
    # 离线推送所用的 Kafka topic
    toOfflinePushTopic: toOfflinePush
    # Redis topic 的消费组 ID
    toRedisGroupID: redis
    # MongoDB topic 的消费组 ID
    toMongoGroupID: mongo
    # 推送通知 topic 的消费组 ID
    toPushGroupID: push
    # 离线推送 topic 的消费组 ID
    toOfflinePushGroupID: offlinePush
    # TLS（传输层安全）配置
    tls:
      # 是否启用 TLS
      enableTLS: false
      # CA 证书文件路径
      caCrt:
      # 客户端证书文件路径
      clientCrt:
      # 客户端私钥文件路径
      clientKey:
      # 客户端私钥密码
      clientKeyPwd:
      # 是否跳过 TLS 校验（生产环境不建议开启）
      insecureSkipVerify: false

  redis.yml: |
    address: [ "redis-service:16379" ]
    username:
    password: DobuFNo6JREDRSbfo4OVHq7E  # Redis 密码
    clusterMode: false
    db: 0
    maxRetry: 10
