      # 仅在 autoSetPorts 设为 false 时生效。
      ports: [ 10240 ]

    prometheus:
      # 是否开启 Prometheus 监控
      enable: true
      # Prometheus 监听端口列表，必须与 rpc.ports 数量一致，监控才能正确采集
      ports: [ 12240 ]

  openim-rpc-group.yml: |
    rpc:
      # 本 RPC 服务注册使用的 IP；留空则默认取内网 IP
      registerIP:
      # RPC 服务的监听 IP；设为 0.0.0.0 表示同时监听内外网 IP，留空则自动使用内网 IP
      listenIP: 0.0.0.0
      # autoSetPorts 表示是否自动分配端口
      # 在 kubernetes 中部署时请设为 false
      autoSetPorts: false
      # RPC 服务监听的端口列表；配置多个端口会启动多个实例，数量必须与 prometheus 端口数一致
      # 仅在 autoSetPorts 设为 false 时生效。
      ports: [ 10260 ]

    prometheus:
      # 是否开启 Prometheus 监控
      enable: true
      # Prometheus 监听端口列表，必须与 rpc.ports 数量一致，监控才能正确采集
      ports: [ 12260 ]

    enableHistoryForNewMembers: true

  openim-rpc-msg.yml: |
    rpc:
      # 本 RPC 服务注册使用的 IP；留空则默认取内网 IP
      registerIP:
      # RPC 服务的监听 IP；设为 0.0.0.0 表示同时监听内外网 IP，留空则自动使用内网 IP
      listenIP: 0.0.0.0
      # autoSetPorts 表示是否自动分配端口
      # 在 kubernetes 中部署时请设为 false
