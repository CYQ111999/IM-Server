  minio.yml: |
    # MinIO 的 bucket 名称
    bucket: im-files
    # MinIO 认证用的 Access Key ID
    accessKeyID: im_minio
    # MinIO 认证用的 Secret Access Key
    secretAccessKey: pg44FwzC5yhwlP75LhJnFMPX
    # MinIO 认证用的 Session Token（可选）
    sessionToken:
    # MinIO 服务的内网地址
    internalAddress: minio-service:10005
    # MinIO 服务的外网地址，供外部访问；支持使用域名，HTTP 与 HTTPS 均可
    externalAddress: http://minio-service:10005
    # 是否允许对该 bucket 进行公开只读访问
    publicRead: "false"

  notification.yml: |
    groupCreated:
      isSendMsg: true
    # 消息发送的可靠性级别。
    # 设为 1 表示仅在线时发送，设为 2 表示保证送达。
      reliabilityLevel: 1
    # 仅在 'isSendMsg' 为 true 时生效。
    # 用于控制是否统计未读消息。
      unreadCount: false
    # 离线推送相关配置。
      offlinePush:
        # 是否启用离线推送。
        enable: false
        # 创建群组时通知的标题。
        title: create group title
        # 通知的描述内容。
        desc: create group desc
        # 通知的附加信息。
        ext: create group ext

    groupInfoSet:
      isSendMsg: false
      reliabilityLevel: 1
      unreadCount: false
      offlinePush:
