  prometheus.yml: |
    # 全局配置
    global:
      scrape_interval:     15s # 抓取间隔设为 15 秒，默认是 1 分钟。
      evaluation_interval: 15s # 每 15 秒评估一次规则，默认是 1 分钟。
      # scrape_timeout 使用全局默认值（10s）。

    # Alertmanager 配置
    alerting:
      alertmanagers:
        - static_configs:
            - targets: [internal_ip:19093]

    # 规则只加载一次，之后按全局 evaluation_interval 周期性评估。
    rule_files:
      - instance-down-rules.yml
    # - first_rules.yml
    # - second_rules.yml

    # 抓取配置，只包含一个待抓取的端点：
    # 这里抓取的是 Prometheus 自身。
    scrape_configs:
      # 任务名会作为 "job=job_name" 标签附加到本配置抓取到的所有时间序列上。
      # Prometheus 采集的监控信息

      # Prometheus 抓取应用服务的指标
