apiVersion: v1
kind: ConfigMap
metadata:
  name: openim-config
data:
  discovery.yml: |
    enable: "kubernetes" # 可选 "kubernetes" 或 "etcd"
    kubernetes:
      namespace: default
    etcd:
      rootDirectory: im
      address: [ localhost:12379 ]
      username: ''
      password: ''

    rpcService:
      user: user-rpc-service
      friend: friend-rpc-service
      msg: msg-rpc-service
      push: push-rpc-service
      messageGateway: messagegateway-rpc-service
      group: group-rpc-service
      auth: auth-rpc-service
      conversation: conversation-rpc-service
      third: third-rpc-service

  log.yml: |
    # 日志存储路径，默认值即可；如需修改请填写完整路径
    storageLocation: ./logs/
    # 日志轮转周期（小时），默认值即可
    rotationTime: 24
    # 保留的日志文件数量，默认值即可
    remainRotationCount: 2
    # 日志级别：生产环境用 3；调试环境用 6 可输出更详细的日志
    remainLogLevel: 6
    # 是否输出到标准输出，默认值即可
    isStdout: true
    # 日志是否使用 JSON 格式，默认值即可
    isJson: false
    # RPC 方法日志中，当 KeyAndValues 的值长度超过 50 时输出简化日志
    isSimplify: true

  mongodb.yml: |
    # 数据库连接 URI；若直接使用地址与账号密码配置，可留空
    uri: ''
    # MongoDB 服务器地址列表
    address: [ mongo-service:37017 ]
    # 数据库名称
    database: im_v3
    # 数据库认证用户名
    username: ''  # 业务账号，由 Secret 注入
    # 数据库认证密码
    password: ''  # 业务账号密码，由 Secret 注入
    # 数据库认证源；使用 root 用户时填 admin
    authSource: im_v3
    # 连接池最大连接数
    maxPoolSize: 100
    # 数据库连接失败时的最大重试次数
    maxRetry: 10

  local-cache.yml: |
    user:
      topic: DELETE_CACHE_USER
      slotNum: 100
      slotSize: 2000
      successExpire: 300
      failedExpire: 5
    group:
      topic: DELETE_CACHE_GROUP
      slotNum: 100
      slotSize: 2000
      successExpire: 300
      failedExpire: 5
    friend:
      topic: DELETE_CACHE_FRIEND
      slotNum: 100
      slotSize: 2000
      successExpire: 300
      failedExpire: 5
    conversation:
      topic: DELETE_CACHE_CONVERSATION
      slotNum: 100
      slotSize: 2000
      successExpire: 300
      failedExpire: 5

  openim-api.yml: |
    api:
      # 监听 IP；0.0.0.0 表示同时监听内外网 IP，建议使用默认值
      listenIP: 0.0.0.0
      # 监听端口；配置多个端口会启动多个实例，数量必须与 prometheus.ports 一致
      ports: [ 10002 ]
      # API 压缩级别；0：默认压缩，1：压缩率最优，2：速度最优，-1：不压缩
      compressionLevel: 0

    prometheus:
      # 是否开启 prometheus
      enable: true
      # Prometheus 监听端口，数量必须与 api.ports 一致
      ports: [ 12002 ]
      # 该地址可通过浏览器访问
      grafanaURL: http://127.0.0.1:13000/

  openim-rpc-user.yml: |
    rpc:
      # API 或其他 RPC 通过该 IP 访问本 RPC；留空则默认取内网 IP
      registerIP:
      # 监听 IP；0.0.0.0 表示同时监听内外网 IP，留空则默认自动获取内网 IP
      listenIP: 0.0.0.0
      # autoSetPorts 表示是否自动分配端口
      # 在 kubernetes 中部署时请设为 false
      autoSetPorts: false
      # RPC 服务监听的端口列表；配置多个端口会启动多个实例，数量必须与 prometheus 端口数一致
      # 仅在 autoSetPorts 设为 false 时生效。
      ports: [ 10320 ]
    prometheus:
      # 是否开启 prometheus
      enable: true
      # Prometheus 监听端口，数量必须与 rpc.ports 一致
      ports: [ 12320 ]

  openim-crontask.yml: |
    cronExecuteTime: 0 2 * * *
    retainChatRecords: 365
    fileExpireTime: 180
    deleteObjectType: ["msg-picture","msg-file", "msg-voice","msg-video","msg-video-snapshot","sdklog"]

  openim-msggateway.yml: |
    rpc:
      # 本 RPC 服务注册使用的 IP；留空则默认取内网 IP
      registerIP:
      # autoSetPorts 表示是否自动分配端口
      # 在 kubernetes 中部署时请设为 false
      autoSetPorts: false
      # RPC 服务监听的端口列表；配置多个端口会启动多个实例，数量必须与 prometheus 端口数一致
      # 仅在 autoSetPorts 设为 false 时生效。
      ports: [ 10140 ]

    prometheus:
      # 是否开启 Prometheus 监控
      enable: true
      # Prometheus 监听端口列表，必须与 rpc.ports 数量一致，监控才能正确采集
      ports: [ 12140 ]

    # RPC/WebSocket 服务的监听 IP；设为 0.0.0.0 表示同时监听内外网 IP，留空则自动使用内网 IP
    listenIP: 0.0.0.0

    longConnSvr:
      # WebSocket 监听端口，数量必须与 rpc.ports 一致
      ports: [ 10001 ]
      # WebSocket 最大连接数
      websocketMaxConnNum: 100000
      # WebSocket 完整消息包的最大长度
      websocketMaxMsgLen: 4096
      # WebSocket 连接握手超时时间（秒）
      websocketTimeout: 10

  openim-msgtransfer.yml: |
    prometheus:
      # 是否开启 Prometheus 监控
      enable: true
      # Prometheus 监听端口列表，每个端口对应一个监控实例，请相应管理
      # 由于已启动四个实例，因此这里需要指定四个端口
      ports: [ 12020 ]

  openim-push.yml: |
    rpc:
      # 本 RPC 服务注册使用的 IP；留空则默认取内网 IP
      registerIP:
      # RPC 服务的监听 IP；设为 0.0.0.0 表示同时监听内外网 IP，留空则自动使用内网 IP
      listenIP: 0.0.0.0
      # autoSetPorts 表示是否自动分配端口
      # 在 kubernetes 中部署时请设为 false
      autoSetPorts: false
      # RPC 服务监听的端口列表；配置多个端口会启动多个实例，数量必须与 prometheus 端口数一致
      # 仅在 autoSetPorts 设为 false 时生效。
      ports: [ 10170 ]


    prometheus:
      # 是否开启 Prometheus 监控
      enable: true
      # Prometheus 监听端口列表，必须与 rpc.ports 数量一致，监控才能正确采集
      ports: [ 12170 ]

    maxConcurrentWorkers: 3
    # 离线推送可使用 geTui，也可选择 fcm 或 jpush；需同时填写对应厂商的配置。
    enable:
    geTui:
      pushUrl: https://restapi.getui.com/v2/$appId
      masterSecret:
      appKey:
      intent:
      channelID:
      channelName:
    fcm:
      # 优先使用文件路径；文件路径为空时改用 URL
      filePath:   # 文件路径由 -c 参数（`mage` 默认传 `config/`）与 filePath 拼接而成。
      authURL:   #  必须以 https 或 http 开头。
    jpush:
      appKey:
      masterSecret:
      pushURL:
      pushIntent:

    # iOS 推送提示音与角标数量
    iosPush:
      pushSound: xxx
      badgeCount: true
      production: false

    fullUserCache: true

  openim-rpc-auth.yml: |
    rpc:
      # 本 RPC 服务注册使用的 IP；留空则默认取内网 IP
      registerIP:
      # RPC 服务的监听 IP；设为 0.0.0.0 表示同时监听内外网 IP，留空则自动使用内网 IP
      listenIP: 0.0.0.0
      # autoSetPorts 表示是否自动分配端口
      # 在 kubernetes 中部署时请设为 false
      autoSetPorts: false
      # RPC 服务监听的端口列表；配置多个端口会启动多个实例，数量必须与 prometheus 端口数一致
      # 仅在 autoSetPorts 设为 false 时生效。
      ports: [ 10200 ]

    prometheus:
      # 是否开启 Prometheus 监控
      enable: true
      # Prometheus 监听端口列表，必须与 rpc.ports 数量一致，监控才能正确采集
      ports: [12200]

    tokenPolicy:
      # token 有效期（天）
      expire: 90

  openim-rpc-conversation.yml: |
    rpc:
      # 本 RPC 服务注册使用的 IP；留空则默认取内网 IP
      registerIP:
      # RPC 服务的监听 IP；设为 0.0.0.0 表示同时监听内外网 IP，留空则自动使用内网 IP
      listenIP: 0.0.0.0
      # autoSetPorts 表示是否自动分配端口
      # 在 kubernetes 中部署时请设为 false
      autoSetPorts: false
      # RPC 服务监听的端口列表；配置多个端口会启动多个实例，数量必须与 prometheus 端口数一致
      # 仅在 autoSetPorts 设为 false 时生效。
      ports: [ 10220 ]

    prometheus:
      # 是否开启 Prometheus 监控
      enable: true
      # Prometheus 监听端口列表，必须与 rpc.ports 数量一致，监控才能正确采集
      ports: [ 12200 ]

    tokenPolicy:
      # token 有效期（天）
      expire: 90

  openim-rpc-friend.yml: |
    rpc:
      # 本 RPC 服务注册使用的 IP；留空则默认取内网 IP
