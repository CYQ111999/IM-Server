---
apiVersion: v1
kind: Service
metadata:
  name: minio-service
spec:
  selector:
    app: minio
  ports:
    - name: minio
      protocol: TCP
      port: 10005 # 访问 MinIO 服务的外部端口
      targetPort: 9000 # MinIO 服务的容器端口
    - name: minio-console
      protocol: TCP
      port: 19090 # 访问 MinIO 控制台的外部端口
      targetPort: 9090 # MinIO 控制台的容器端口
  type: NodePort
